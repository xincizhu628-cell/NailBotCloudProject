<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Placeholder</title>
    <style>
      :root {
        --bg: #fff7fb;
        --ink: #2d2330;
        --pink: #df5e93;
        --line: rgba(111, 77, 97, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, Arial, sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, #fff, var(--bg));
      }

      main {
        width: min(760px, 100%);
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(208, 106, 156, 0.18);
      }

      p {
        color: #756b78;
      }

      a {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        padding: 0 16px;
        border-radius: 8px;
        color: #fff;
        background: var(--pink);
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Campaign Page</p>
      <h1 id="campaign-title">Activity placeholder</h1>
      <p>This page is reserved for the selected campaign details.</p>
      <a href="index.html?view=home">Back to Home</a>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (id) document.querySelector("#campaign-title").textContent = id.replaceAll("-", " ");
    </script>
  </body>
</html>
