<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coupon Wallet</title>
    <style>
      :root {
        --bg: #fff7fb;
        --panel: rgba(255, 255, 255, 0.88);
        --ink: #2d2330;
        --muted: #756b78;
        --pink: #f7a8c8;
        --pink-strong: #df5e93;
        --violet: #8c7cff;
        --line: rgba(111, 77, 97, 0.16);
        --shadow: 0 24px 70px rgba(208, 106, 156, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Microsoft YaHei", Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(140, 124, 255, 0.16), transparent 32rem),
          linear-gradient(135deg, #fff9fc, var(--bg) 58%, #f8fbff);
      }

      button,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .page {
        width: min(1280px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 26px 0 52px;
      }

      .back-btn {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        color: var(--pink-strong);
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 700;
        box-shadow: 0 12px 28px rgba(223, 94, 147, 0.1);
      }

      .hero {
        margin-top: 24px;
        padding: clamp(22px, 4vw, 40px);
        border: 1px solid rgba(247, 168, 200, 0.46);
        border-radius: 22px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(255, 228, 239, 0.72)),
          radial-gradient(circle at 88% 12%, rgba(132, 230, 213, 0.26), transparent 22rem);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--pink-strong);
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 3.2rem);
        line-height: 1.05;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        margin: 20px 0 16px;
      }

      .toolbar label {
        color: var(--muted);
        font-weight: 700;
      }

      .toolbar select {
        min-width: 180px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.86);
        padding: 10px 12px;
        color: var(--ink);
        font-weight: 700;
      }

      .coupon-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }

      .coupon-card {
        min-height: 188px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid rgba(247, 168, 200, 0.5);
        border-radius: 18px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(255, 228, 239, 0.74)),
          radial-gradient(circle at 92% 10%, rgba(140, 124, 255, 0.2), transparent 11rem);
        padding: 16px;
        box-shadow: 0 18px 48px rgba(208, 106, 156, 0.12);
      }

      .coupon-card strong {
        display: block;
        font-size: 1.1rem;
        line-height: 1.18;
      }

      .tag {
        align-self: flex-start;
        color: var(--pink-strong);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(247, 168, 200, 0.44);
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .discount {
        margin: 14px 0 8px;
        color: var(--violet);
        font-size: 1.45rem;
        font-weight: 900;
      }

      .date {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .empty {
        grid-column: 1 / -1;
        border: 1px dashed var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.7);
        padding: 34px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 1120px) {
        .coupon-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 860px) {
        .coupon-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .toolbar select {
          width: 100%;
        }

        .coupon-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }
      }

      @media (max-width: 420px) {
        .coupon-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  <link rel="stylesheet" href="assets/css/shop-coupons.css?v=20260910c"><script src="assets/js/customer-translations.js?v=20260910c"></script><script src="assets/js/customer-i18n.js?v=20260910c"></script></head>
  <body>
    <main class="page">
      <button class="back-btn" id="back-btn" type="button">← Back</button>

      <section class="hero">
        <p class="eyebrow">Coupon Wallet</p>
        <h1 id="wallet-title">Loading your benefits...</h1>
      </section>

      <div class="toolbar">
        <label for="promo-type-filter">优惠类型</label>
        <select id="promo-type-filter">
          <option value="">全部优惠</option>
          <option value="满减优惠">满减优惠</option>
          <option value="折扣优惠">折扣优惠</option>
          <option value="买送优惠">买送优惠</option>
          <option value="免费商品">免费商品</option>
        </select>
      </div>

      <div class="wallet-columns"><section class="coupon-grid" id="coupon-grid">
        <div class="empty">Loading...</div>
      </section><aside class="coupon-gain"><h2>How to gain coupons?</h2><a href="index.html?view=products&amp;shop=coupons">Go to Shop / 去商城</a><a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">Go to Tiktok</a><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Go to Instagram</a><h3>Join Latest Activities</h3><div id="coupon-activities" aria-live="polite">Loading...</div></aside></div>
    </main>

    <script src="assets/js/coupon-picker.js?v=20260910c"></script>
    <script>
      let coupons=[];
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function render(){const labels={money_off:'满减优惠',percent_off:'折扣优惠',buy_x_get_y:'买送优惠',free_product:'免费商品'},filter=document.querySelector('#promo-type-filter').value;
        document.querySelector('#coupon-grid').innerHTML=coupons.filter(c=>!filter||labels[c.deal_type]===filter).map(c=>`<article class="coupon-card"><strong data-no-translate>${esc(c.coupon_name)}</strong><p>${esc(CouponPicker.summary(c))}</p><p>${esc(CouponPicker.stateName[c.coupon_use_status])}</p><p>有效期：${esc(c.start_date||'不限')} 至 ${esc(c.expiry_date||'不限')}</p></article>`).join('')||'<p>暂无优惠券</p>';
      }
      async function load(){try{const token=new URLSearchParams(location.search).get('claim');const data=await CouponPicker.wallet(token);coupons=data.coupons;document.querySelector('#wallet-title').textContent=`用户 ${data.user.username}，您还有 ${coupons.filter(c=>c.coupon_use_status==='unused').length} 个优惠未使用`;if(token)history.replaceState(null,'','coupon-wallet.html');render();}catch(e){document.querySelector('#wallet-title').textContent=e.message;}}
      document.querySelector('#promo-type-filter').onchange=render;document.querySelector('#back-btn').onclick=()=>location.href='index.html';void load();
    </script>
  <script src="assets/js/shop-coupons.js?v=20260910c"></script></body>
</html>
