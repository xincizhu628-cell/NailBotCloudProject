<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders | Nailbot</title>
  <link rel="stylesheet" href="styles.css?v=123" />
  <style>
    .orders-page { max-width: 1040px; margin: auto; padding: 36px 24px 64px; }
    .orders-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 28px 0; }
    h1 { margin: 4px 0; font-size: clamp(2rem,5vw,3.4rem); }
    .orders-page a { color: var(--pink-strong); font-weight: 700; }
    .orders-page button { border: 1px solid var(--line); border-radius: 10px; padding: 11px 20px; background: white; color: var(--ink); }
    .orders-page button:disabled { opacity: .5; cursor: default; }
    .orders-page p { color: var(--muted); line-height: 1.6; }
    .order-card { background: var(--panel-strong); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin: 0 0 20px; box-shadow: 0 8px 25px #d06a9c0a; }
    .order-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .order-top h2 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
    .order-total { font-size: 1.5rem; font-weight: 750; }
    .order-meta { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 16px; margin: 24px 0; }
    .order-meta dt { color: var(--muted); font-size: .8rem; margin-bottom: 6px; }
    .order-meta dd { margin: 0; overflow-wrap: anywhere; }
    .order-items { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    .order-items li { display: flex; justify-content: space-between; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .order-code { display: inline-block; padding: 5px 10px; margin: 0 6px 6px 0; background: var(--pink-soft); border-radius: 6px; font-family: monospace; font-size: 1rem; }
    #load-more { display: block; margin: 24px auto; }
    [hidden] { display: none !important; }
    @media(max-width:540px) { .orders-page { padding: 20px 14px; } .order-card { padding: 18px; } }
  </style>
</head>
<body>
  <main class="orders-page">
    <a href="profile.html">← Back to profile</a>
    <header class="orders-header"><div><p class="eyebrow">NAILBOT</p><h1>My Orders</h1><p>Your purchases, payment and delivery updates.</p></div><button id="refresh-orders" type="button">Refresh</button></header>
    <p id="orders-status" role="status" aria-live="polite">Loading your orders…</p>
    <p id="sign-in" hidden><a href="index.html">Sign in to view your orders →</a></p>
    <section id="orders-list" aria-label="Order history"></section>
    <button id="load-more" type="button" hidden>Load more orders</button>
  </main>
  <script src="assets/js/user-orders.js?v=20260909-fulfillment"></script>
</body>
</html>
